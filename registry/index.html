<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реєстр верифікованих психологів — psy-cert.com.ua</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://psy-cert.com.ua/registry/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #0e1a2b;
    --ink-soft: #4a566b;
    --ink-muted: #8693a8;
    --line: #e3e7ee;
    --accent: #1e3a8a;
    --accent-hover: #1e40af;
    --green: #065f46;
    --green-bg: #ecfdf5;
    --radius: 10px;
    --maxw: 1000px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .brand-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  .header-nav a {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.15s;
  }
  .header-nav a:hover { color: var(--accent); }

  /* Main */
  main { max-width: var(--maxw); margin: 0 auto; padding: 40px 24px 80px; }

  /* Page hero */
  .page-hero { margin-bottom: 32px; }
  .page-hero h1 { font-size: clamp(22px, 3.5vw, 32px); font-weight: 700; margin: 0 0 8px; letter-spacing: -0.02em; }
  .page-hero p { font-size: 15px; color: var(--ink-soft); margin: 0; }

  /* Status notice */
  .dev-notice {
    background: #fffbeb;
    border: 1px solid #fcd34d;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    color: #92400e;
    margin-bottom: 28px;
  }

  /* Filters */
  .filters {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    align-items: center;
  }
  .filter-select {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  .filter-select:focus { border-color: var(--accent); }
  .filter-reset {
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 4px;
    font-family: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .filter-reset:hover { color: var(--ink); }

  /* Stats bar */
  .stats-bar {
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 20px;
  }
  .stats-bar strong { color: var(--ink-soft); }

  /* Grid */
  .psychologist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;
  }

  /* Card */
  .psy-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .psy-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(30, 58, 138, 0.08);
  }

  .psy-verified {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--green);
    background: var(--green-bg);
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .psy-verified::before {
    content: '✓';
    font-size: 10px;
  }

  .psy-name {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .psy-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .psy-tag {
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--bg);
    border-radius: 6px;
    padding: 3px 8px;
  }

  .psy-bio {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 8px 0 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .psy-cert-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-top: 10px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--ink-muted);
  }
  .empty-state p { margin: 0; font-size: 15px; }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink-muted);
    font-size: 15px;
    padding: 40px 0;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    main { padding: 24px 16px 60px; }
    .psychologist-grid { grid-template-columns: 1fr; }
    .filters { gap: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="/"><span class="brand-dot"></span>psy-cert.com.ua</a>
    <nav class="header-nav">
      <a href="/articles/">Матеріали</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-hero">
    <h1>Реєстр верифікованих психологів</h1>
    <p>Фахівці, що пройшли верифікацію psy-cert.com.ua — підтверджена освіта, сертифікати, методи роботи</p>
  </div>

  <div class="dev-notice">
    Реєстр поки в закритому режимі — верифікація фахівців у процесі. Повноцінний запуск — осінь 2026.
  </div>

  <div class="filters">
    <select class="filter-select" id="filter-city">
      <option value="">Усі міста</option>
      <option>Київ</option>
      <option>Харків</option>
      <option>Одеса</option>
      <option>Дніпро</option>
      <option>Запоріжжя</option>
      <option>Львів</option>
      <option>Вінниця</option>
      <option>Чернівці</option>
      <option>Онлайн</option>
    </select>
    <select class="filter-select" id="filter-specialization">
      <option value="">Усі напрями</option>
      <option value="КПТ (когнітивно-поведінкова терапія)">КПТ</option>
      <option value="Психодинамічна терапія">Психодинамічна</option>
      <option value="Гештальт-терапія">Гештальт</option>
      <option value="Тілесно-орієнтована терапія">Тілесно-орієнтована</option>
      <option value="EMDR">EMDR</option>
      <option value="Сімейна системна терапія">Сімейна системна</option>
      <option value="Екзистенційна терапія">Екзистенційна</option>
      <option value="Інше">Інше</option>
    </select>
    <button class="filter-reset" id="reset-filters">Скинути</button>
  </div>

  <div class="stats-bar" id="stats-bar"></div>

  <div id="registry-container">
    <div class="loading"><span class="spinner"></span>Завантаження…</div>
  </div>
</main>

<script>
  (function () {

    const citySelect = document.getElementById('filter-city');
    const specSelect = document.getElementById('filter-specialization');
    const resetBtn   = document.getElementById('reset-filters');
    const container  = document.getElementById('registry-container');
    const statsBar   = document.getElementById('stats-bar');

    let allData = [];

    async function loadRegistry() {
      try {
        const res = await fetch('/api/registry');
        const json = await res.json();
        if (!json.success) throw new Error('api error');
        allData = json.data || [];
        renderFiltered();
      } catch {
        container.innerHTML = '<div class="empty-state"><p>Не вдалося завантажити реєстр. Спробуйте оновити сторінку.</p></div>';
      }
    }

    function renderFiltered() {
      const city = citySelect.value;
      const spec = specSelect.value;

      let data = allData;
      if (city) data = data.filter(p => p.city === city);
      if (spec) data = data.filter(p => p.specialization === spec);

      statsBar.innerHTML = data.length
        ? `Знайдено: <strong>${data.length}</strong> фахівц${data.length === 1 ? 'я' : data.length < 5 ? 'і' : 'ів'}`
        : '';

      if (!data.length) {
        container.innerHTML = '<div class="empty-state"><p>За вашим запитом нікого не знайдено. Спробуйте змінити фільтри.</p></div>';
        return;
      }

      container.innerHTML = `<div class="psychologist-grid">${data.map(card).join('')}</div>`;
    }

    function card(p) {
      const specLabel = p.specialization || '';
      const expText = p.experience_years ? `${p.experience_years} р. досвіду` : '';
      const bioHtml = p.bio ? `<p class="psy-bio">${escHtml(p.bio)}</p>` : '';
      const certHtml = p.has_certificate ? '<span class="psy-cert-badge">Має сертифікат</span>' : '';

      return `
        <a href="/p/${escHtml(p.public_id)}/" class="psy-card">
          <span class="psy-verified">Верифіковано</span>
          <p class="psy-name">${escHtml(p.name)}</p>
          <div class="psy-meta">
            ${p.city ? `<span class="psy-tag">${escHtml(p.city)}</span>` : ''}
            ${specLabel ? `<span class="psy-tag">${escHtml(specLabel)}</span>` : ''}
            ${expText ? `<span class="psy-tag">${expText}</span>` : ''}
          </div>
          ${bioHtml}
          ${certHtml}
        </a>`;
    }

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    citySelect.addEventListener('change', renderFiltered);
    specSelect.addEventListener('change', renderFiltered);
    resetBtn.addEventListener('click', () => {
      citySelect.value = '';
      specSelect.value = '';
      renderFiltered();
    });

    loadRegistry();
  })();
</script>

</body>
</html>
