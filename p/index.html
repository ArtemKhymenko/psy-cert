<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профіль психолога — psy-cert.com.ua</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #0e1a2b;
    --ink-soft: #4a566b;
    --ink-muted: #8693a8;
    --line: #e3e7ee;
    --accent: #1e3a8a;
    --accent-hover: #1e40af;
    --green: #065f46;
    --green-bg: #ecfdf5;
    --green-border: #6ee7b7;
    --radius: 10px;
    --maxw: 680px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 100;
  }
  header .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; font-weight: 700; font-size: 15px;
    color: var(--ink); letter-spacing: -0.02em;
  }
  .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .back-link {
    font-size: 14px; font-weight: 500; color: var(--ink-soft);
    text-decoration: none; display: flex; align-items: center; gap: 6px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--accent); }

  /* Main */
  main { max-width: var(--maxw); margin: 0 auto; padding: 40px 24px 80px; }

  /* Profile card */
  .profile-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }

  .profile-header {
    padding: 28px 28px 24px;
    border-bottom: 1px solid var(--line);
  }

  .verified-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--green);
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  .verified-badge::before { content: '✓'; }

  .profile-name {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }

  .profile-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .profile-tag {
    font-size: 14px;
    color: var(--ink-soft);
    background: var(--bg);
    border-radius: 6px;
    padding: 4px 10px;
  }

  /* Profile body */
  .profile-body {
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .profile-section h3 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 6px;
  }
  .profile-section p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.6;
  }

  .cert-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
  }

  .website-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    word-break: break-all;
  }
  .website-link:hover { text-decoration: underline; }

  /* Verification footer */
  .verification-footer {
    margin: 0 28px 28px;
    padding: 16px 20px;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: var(--radius);
    font-size: 14px;
    color: var(--green);
    line-height: 1.5;
  }
  .verification-footer strong { font-weight: 700; }

  /* Registration date */
  .reg-date {
    font-size: 13px;
    color: var(--ink-muted);
    padding: 0 28px 24px;
  }

  /* Not found */
  .not-found {
    text-align: center;
    padding: 60px 24px;
  }
  .not-found h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
  .not-found p { color: var(--ink-soft); margin: 0 0 24px; }
  .not-found a { color: var(--accent); font-weight: 600; }

  /* Loading */
  .loading { display: flex; align-items: center; gap: 10px; color: var(--ink-muted); font-size: 15px; padding: 60px 0; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    main { padding: 24px 16px 60px; }
    .profile-header, .profile-body { padding: 20px 18px; }
    .verification-footer, .reg-date { margin-left: 18px; margin-right: 18px; }
    .reg-date { padding: 0 18px 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="/"><span class="brand-dot"></span>psy-cert.com.ua</a>
    <a class="back-link" href="/registry/">← Реєстр</a>
  </div>
</header>

<main id="main-content">
  <div class="loading"><span class="spinner"></span>Завантаження профілю…</div>
</main>

<script>
  (function () {
    const SPEC_LABELS = {
      cbt: 'КПТ', gestalt: 'Гештальт', psychoanalysis: 'Психоаналіз',
      emdr: 'EMDR', systemic: 'Системна сімейна', other: 'Інше'
    };

    const main = document.getElementById('main-content');

    // Extract public_id from pathname: /p/{uuid}/
    const parts = window.location.pathname.split('/').filter(Boolean);
    const publicId = parts[1]; // ['p', 'uuid'] → 'uuid'

    if (!publicId) {
      renderNotFound();
      return;
    }

    fetch(`/api/p/${publicId}`)
      .then(r => r.json())
      .then(json => {
        if (!json.success || !json.data) { renderNotFound(); return; }
        renderProfile(json.data);
      })
      .catch(() => renderNotFound());

    function renderProfile(p) {
      document.title = `${esc(p.name)} — psy-cert.com.ua`;

      const specLabel = SPEC_LABELS[p.specialization] || p.specialization || '';
      const expText = p.experience_years ? `${p.experience_years} р. досвіду` : '';
      const regDate = new Date(p.created_at + 'Z').toLocaleDateString('uk-UA', { year: 'numeric', month: 'long', day: 'numeric' });

      const tagsHtml = [p.city, specLabel, expText].filter(Boolean)
        .map(t => `<span class="profile-tag">${esc(t)}</span>`).join('');

      const bioSection = p.bio ? `
        <div class="profile-section">
          <h3>Про себе</h3>
          <p>${esc(p.bio)}</p>
        </div>` : '';

      const websiteSection = p.website ? `
        <div class="profile-section">
          <h3>Сайт / профіль</h3>
          <a href="${esc(p.website)}" class="website-link" target="_blank" rel="noopener nofollow">${esc(p.website)}</a>
        </div>` : '';

      const certSection = `
        <div class="profile-section">
          <h3>Сертифікат</h3>
          <p>${p.has_certificate
            ? '<span class="cert-row">✓ Має сертифікат відповідно до нових вимог</span>'
            : 'Інформація уточнюється'}</p>
        </div>`;

      main.innerHTML = `
        <div class="profile-card">
          <div class="profile-header">
            <span class="verified-badge">Верифіковано psy-cert.com.ua</span>
            <h1 class="profile-name">${esc(p.name)}</h1>
            <div class="profile-tags">${tagsHtml}</div>
          </div>
          <div class="profile-body">
            ${bioSection}
            ${certSection}
            ${websiteSection}
          </div>
          <div class="verification-footer">
            <strong>Верифікований фахівець</strong> — psy-cert.com.ua підтвердив наявність профільної освіти та відповідність базовим вимогам до практики.
          </div>
          <p class="reg-date">В реєстрі з ${regDate}</p>
        </div>`;
    }

    function renderNotFound() {
      main.innerHTML = `
        <div class="not-found">
          <h1>Профіль не знайдено</h1>
          <p>Можливо, посилання застаріло або фахівець наразі не в реєстрі.</p>
          <a href="/registry/">← Повернутися до реєстру</a>
        </div>`;
    }

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  })();
</script>

</body>
</html>
