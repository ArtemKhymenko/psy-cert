<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Адмін — psy-cert.com.ua</title>
<meta name="robots" content="noindex, nofollow, noarchive">

<style>
  :root {
    --bg: #f5f6f8;
    --surface: #fff;
    --ink: #0e1a2b;
    --ink-soft: #4a566b;
    --ink-muted: #8693a8;
    --line: #e3e7ee;
    --accent: #1e3a8a;
    --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* Login screen */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
  }
  .login-box h1 { font-size: 20px; font-weight: 700; margin: 0 0 20px; }
  .login-input {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 14px; font-family: inherit;
    outline: none; margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .login-input:focus { border-color: var(--accent); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 18px;
    background: var(--accent);
    color: #fff; border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: #1e40af; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-ghost {
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: var(--line); }
  .error-msg { color: #991b1b; font-size: 13px; margin-top: 8px; display: none; }

  /* Admin panel */
  #admin-panel { display: none; }
  .admin-header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .admin-header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  .admin-header .meta { font-size: 13px; color: var(--ink-muted); }

  .admin-main { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* Stats row */
  .stats-row {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px;
  }
  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-pill .stat-num { font-size: 22px; font-weight: 700; }
  .stat-pill .stat-label { color: var(--ink-muted); }

  /* Filter bar */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 16px; align-items: center;
  }
  .filter-bar select, .filter-bar input {
    padding: 7px 10px; border: 1px solid var(--line);
    border-radius: var(--radius); font-size: 13px;
    font-family: inherit; background: var(--surface);
    outline: none;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  th {
    text-align: left; padding: 10px 14px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-muted);
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    white-space: nowrap;
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbfd; }

  .name-cell { font-weight: 600; }
  .email-cell { color: var(--ink-soft); font-size: 13px; }
  .date-cell { color: var(--ink-muted); font-size: 12px; white-space: nowrap; }

  /* Status badge */
  .status-badge {
    display: inline-block; padding: 3px 8px;
    border-radius: 4px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .status-pending  { background: #f3f4f6; color: #374151; }
  .status-approved { background: #dbeafe; color: #1e40af; }
  .status-published { background: #d1fae5; color: #065f46; }
  .status-rejected { background: #fee2e2; color: #991b1b; }

  /* Actions */
  .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .action-btn {
    padding: 4px 8px; font-size: 11px; font-weight: 600;
    border: 1px solid transparent; border-radius: 4px;
    cursor: pointer; transition: background 0.12s;
    font-family: inherit;
  }
  .action-approve { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
  .action-approve:hover { background: #bfdbfe; }
  .action-publish { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
  .action-publish:hover { background: #a7f3d0; }
  .action-reject { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  .action-reject:hover { background: #fecaca; }
  .action-pending { background: var(--bg); color: var(--ink-soft); border-color: var(--line); }
  .action-pending:hover { background: var(--line); }

  .bio-preview { font-size: 12px; color: var(--ink-muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .website-link { font-size: 12px; color: var(--accent); }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #111; color: #fff;
    padding: 10px 16px; border-radius: var(--radius);
    font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 9999;
  }
  #toast.show { opacity: 1; }

  /* Loading */
  .loading { padding: 40px; text-align: center; color: var(--ink-muted); }

  /* Cert indicator */
  .cert-yes { color: #065f46; font-weight: 600; }
  .cert-no  { color: var(--ink-muted); }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <h1>psy-cert — адмін</h1>
    <input type="password" id="secret-input" class="login-input" placeholder="Admin secret" autocomplete="current-password">
    <div>
      <button class="btn" id="login-btn" style="width:100%">Увійти</button>
    </div>
    <p class="error-msg" id="login-error">Невірний ключ або помилка з'єднання</p>
  </div>
</div>

<!-- Admin panel -->
<div id="admin-panel">
  <div class="admin-header">
    <h1>psy-cert — адмін</h1>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="meta" id="last-updated"></span>
      <button class="btn btn-ghost btn-sm" id="refresh-btn">Оновити</button>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Вийти</button>
    </div>
  </div>

  <div class="admin-main">
    <div class="stats-row" id="stats-row"></div>

    <div class="filter-bar">
      <select id="status-filter">
        <option value="">Всі статуси</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="published">Published</option>
        <option value="rejected">Rejected</option>
      </select>
      <input type="text" id="search-input" placeholder="Пошук за ім'ям або email…" style="min-width:220px">
    </div>

    <div class="table-wrap" id="table-wrap">
      <div class="loading">Завантаження…</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  (function () {
    const STATUS_LABELS = { pending: 'Pending', approved: 'Approved', published: 'Published', rejected: 'Rejected' };
    const SESSION_KEY = 'psy_admin_secret';

    let secret = '';
    let allData = [];

    // ── Auth ──
    const loginScreen = document.getElementById('login-screen');
    const adminPanel  = document.getElementById('admin-panel');
    const loginBtn    = document.getElementById('login-btn');
    const logoutBtn   = document.getElementById('logout-btn');
    const secretInput = document.getElementById('secret-input');
    const loginError  = document.getElementById('login-error');

    // Check session
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) { secret = saved; showAdmin(); }

    secretInput.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });

    loginBtn.addEventListener('click', async () => {
      const val = secretInput.value.trim();
      if (!val) return;
      loginBtn.disabled = true;
      loginError.style.display = 'none';
      secret = val;
      const ok = await loadData();
      if (ok) {
        sessionStorage.setItem(SESSION_KEY, secret);
        showAdmin();
      } else {
        loginError.style.display = 'block';
        loginBtn.disabled = false;
        secret = '';
      }
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem(SESSION_KEY);
      secret = '';
      adminPanel.style.display = 'none';
      loginScreen.style.display = 'flex';
      secretInput.value = '';
    });

    document.getElementById('refresh-btn').addEventListener('click', () => loadData().then(renderTable));

    function showAdmin() {
      loginScreen.style.display = 'none';
      adminPanel.style.display = 'block';
      loadData().then(renderTable);
    }

    // ── Data ──
    async function loadData() {
      try {
        const res = await fetch('/api/admin/list', {
          headers: { 'Authorization': `Bearer ${secret}` }
        });
        if (!res.ok) return false;
        const json = await res.json();
        if (!json.success) return false;
        allData = json.data || [];
        document.getElementById('last-updated').textContent = `Оновлено: ${new Date().toLocaleTimeString('uk-UA')}`;
        return true;
      } catch { return false; }
    }

    // ── Status update ──
    async function setStatus(public_id, status, rowEl) {
      try {
        const res = await fetch('/api/admin/status', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${secret}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ public_id, status }),
        });
        const json = await res.json();
        if (!json.success) throw new Error();

        // Update local data
        const rec = allData.find(d => d.public_id === public_id);
        if (rec) rec.status = status;

        // Update row badge
        const badge = rowEl.querySelector('.status-badge');
        badge.className = `status-badge status-${status}`;
        badge.textContent = STATUS_LABELS[status];

        // Update action buttons
        renderActions(rowEl.querySelector('.actions-cell'), { ...rec, status }, public_id);

        toast(`✓ ${rec?.name || public_id} → ${STATUS_LABELS[status]}`);
        renderStats();
      } catch {
        toast('Помилка оновлення');
      }
    }

    // ── Render ──
    function renderTable() {
      renderStats();

      const statusFilter = document.getElementById('status-filter').value;
      const search = document.getElementById('search-input').value.toLowerCase();

      let data = allData;
      if (statusFilter) data = data.filter(d => d.status === statusFilter);
      if (search) data = data.filter(d =>
        d.name.toLowerCase().includes(search) || d.email.toLowerCase().includes(search)
      );

      if (!data.length) {
        document.getElementById('table-wrap').innerHTML = '<div class="loading">Нікого не знайдено</div>';
        return;
      }

      const rows = data.map(p => {
        const date = new Date(p.created_at + 'Z').toLocaleDateString('uk-UA');
        const bioPreview = p.bio ? `<div class="bio-preview" title="${esc(p.bio)}">${esc(p.bio)}</div>` : '';
        const websiteHtml = p.website ? `<a href="${esc(p.website)}" class="website-link" target="_blank" rel="noopener">${esc(p.website.replace(/^https?:\/\//, ''))}</a>` : '';

        return `<tr data-id="${esc(p.public_id)}">
          <td><div class="name-cell">${esc(p.name)}</div>${bioPreview}</td>
          <td class="email-cell">${esc(p.email)}</td>
          <td>${esc(p.city || '—')}</td>
          <td>${esc(p.specialization || '—')}</td>
          <td class="${p.has_certificate ? 'cert-yes' : 'cert-no'}">${p.has_certificate ? '✓ Так' : 'Ні'}</td>
          <td>${websiteHtml}</td>
          <td><span class="status-badge status-${p.status}">${STATUS_LABELS[p.status] || p.status}</span></td>
          <td class="date-cell">${date}</td>
          <td><div class="actions-cell" data-id="${esc(p.public_id)}"></div></td>
        </tr>`;
      }).join('');

      document.getElementById('table-wrap').innerHTML = `
        <table>
          <thead><tr>
            <th>Ім'я / Про себе</th>
            <th>Email</th>
            <th>Місто</th>
            <th>Напрям</th>
            <th>Сертифікат</th>
            <th>Сайт</th>
            <th>Статус</th>
            <th>Дата</th>
            <th>Дії</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;

      // Render action buttons
      data.forEach(p => {
        const table = document.getElementById('table-wrap');
        const row = table.querySelector(`tr[data-id="${CSS.escape(p.public_id)}"]`);
        if (!row) return;
        const cell = row.querySelector('.actions-cell');
        renderActions(cell, p, p.public_id);
      });
    }

    function renderActions(cell, p, public_id) {
      const actions = [];
      if (p.status !== 'pending')   actions.push(['pending',   'Pending',  'action-pending']);
      if (p.status !== 'approved')  actions.push(['approved',  'Approve',  'action-approve']);
      if (p.status !== 'published') actions.push(['published', 'Publish',  'action-publish']);
      if (p.status !== 'rejected')  actions.push(['rejected',  'Reject',   'action-reject']);

      cell.innerHTML = actions.map(([s, label, cls]) =>
        `<button class="action-btn ${cls}" data-status="${s}">${label}</button>`
      ).join('');

      cell.querySelectorAll('.action-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = btn.closest('tr');
          setStatus(public_id, btn.dataset.status, row);
        });
      });

      // Profile link for published
      if (p.status === 'published' && p.public_id) {
        const link = document.createElement('a');
        link.href = `/p/${p.public_id}/`;
        link.target = '_blank';
        link.className = 'action-btn action-pending';
        link.textContent = '↗';
        link.title = 'Профіль';
        cell.appendChild(link);
      }
    }

    function renderStats() {
      const counts = { pending: 0, approved: 0, published: 0, rejected: 0 };
      allData.forEach(d => { if (counts[d.status] !== undefined) counts[d.status]++; });
      const total = allData.length;

      document.getElementById('stats-row').innerHTML = [
        ['Всього', total, ''],
        ['Pending', counts.pending, 'color:#374151'],
        ['Approved', counts.approved, 'color:#1e40af'],
        ['Published', counts.published, 'color:#065f46'],
        ['Rejected', counts.rejected, 'color:#991b1b'],
      ].map(([label, num, style]) => `
        <div class="stat-pill">
          <span class="stat-num" style="${style}">${num}</span>
          <span class="stat-label">${label}</span>
        </div>`).join('');
    }

    // ── Filters ──
    document.getElementById('status-filter').addEventListener('change', renderTable);
    document.getElementById('search-input').addEventListener('input', renderTable);

    // ── Toast ──
    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  })();
</script>

</body>
</html>
